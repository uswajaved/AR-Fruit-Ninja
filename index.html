<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Ninja AR - Hand Tracking</title>
    <!-- MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0d0d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        /* Screen Shake Animation */
        @keyframes screenShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-15px, 15px) rotate(-1deg); }
            40% { transform: translate(15px, -15px) rotate(1deg); }
            60% { transform: translate(-10px, -10px) rotate(-0.5deg); }
            80% { transform: translate(10px, 10px) rotate(0.5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .shake {
            animation: screenShake 0.4s ease-in-out;
        }

        /* WebCam Mirror Video */
        #webcam {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.85;
            filter: contrast(1.05) brightness(0.95);
        }

        /* Canvas overlay */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* HUD elements */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #hud.faded {
            opacity: 0;
        }

        .score-container {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .score-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #aaa;
        }

        .score-val {
            font-size: 32px;
            font-weight: 800;
            color: #ffca28;
            text-shadow: 0 0 10px rgba(255, 202, 40, 0.5);
        }

        .lives-container {
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 12px 20px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .heart {
            font-size: 24px;
            color: #ff5252;
            transition: transform 0.2s, opacity 0.2s;
            filter: drop-shadow(0 0 5px rgba(255, 82, 82, 0.8));
        }

        .heart.lost {
            opacity: 0.2;
            transform: scale(0.8);
            filter: none;
        }

        /* UI Overlays */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            opacity: 1;
            transition: opacity 0.4s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title {
            font-size: 56px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff5252, #ffca28, #4caf50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 30px;
            max-width: 500px;
            line-height: 1.5;
        }

        .diff-selection {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .diff-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 140px;
        }

        .diff-card:hover, .diff-card.selected {
            background: rgba(255, 255, 255, 0.15);
            border-color: #ffca28;
            transform: translateY(-5px);
        }

        .diff-card.selected {
            box-shadow: 0 0 20px rgba(255, 202, 40, 0.4);
        }

        .diff-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .diff-sub {
            font-size: 12px;
            color: #888;
        }

        .btn {
            background: linear-gradient(45deg, #ff5252, #ff793f);
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 20px;
            font-weight: 800;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 82, 82, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(255, 82, 82, 0.6);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* WebCam Warning */
        #warning {
            position: absolute;
            bottom: 20px;
            background: rgba(255, 82, 82, 0.2);
            border: 1px solid #ff5252;
            color: #ff5252;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            z-index: 30;
        }

        /* Kaboom Fullscreen overlay */
        #kaboomFlash {
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 15;
            transition: opacity 0.1s ease-out;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <video id="webcam" playsinline></video>
        <canvas id="canvas"></canvas>
        <div id="kaboomFlash"></div>

        <div id="hud">
            <div class="score-container">
                <div class="score-label">Score</div>
                <div class="score-val" id="score">0</div>
            </div>
            <div class="lives-container" id="lives">
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
            </div>
        </div>

        <!-- Start Overlay -->
        <div class="overlay" id="startOverlay">
            <h1 class="title">Fruit Ninja AR</h1>
            <p class="subtitle">Use your index finger in front of the camera to slice fruit! Avoid the bombs.</p>
            
            <div class="diff-selection">
                <div class="diff-card" onclick="selectDifficulty('easy')">
                    <div class="diff-title" style="color:#4caf50;">Easy</div>
                    <div class="diff-sub">SLICE &amp; CHILL</div>
                </div>
                <div class="diff-card selected" onclick="selectDifficulty('medium')">
                    <div class="diff-title" style="color:#ffca28;">Medium</div>
                    <div class="diff-sub">CLASSIC</div>
                </div>
                <div class="diff-card" onclick="selectDifficulty('hard')">
                    <div class="diff-title" style="color:#ff5252;">Hard</div>
                    <div class="diff-sub">DEATH WISH</div>
                </div>
            </div>

            <button class="btn" id="startBtn" onclick="startGame()">Start Game</button>
        </div>

        <!-- Game Over Overlay -->
        <div class="overlay hidden" id="gameOverOverlay">
            <h1 class="title" style="background: linear-gradient(45deg, #ff5252, #ff793f); -webkit-background-clip: text;">Game Over</h1>
            <p class="subtitle" id="finalScoreText">Your Final Score: 0</p>
            <button class="btn" onclick="restartGame()">Play Again</button>
        </div>

        <div id="warning">Webcam permissions required or secure context (HTTPS) needed!</div>
    </div>

    <script>
        // Audio Context Setup for Sound Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSwooshSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playSplatSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(250, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playKaboomSound(xPos) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // Stereo Panning derived from bomb X position
            const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
            if (panner) {
                const panValue = (xPos / canvas.width) * 2 - 1; 
                panner.pan.setValueAtTime(Math.max(-1, Math.min(1, panValue)), audioCtx.currentTime);
            }

            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, audioCtx.currentTime);
            filter.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.5);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            if (panner) {
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(panner);
                panner.connect(audioCtx.destination);
            } else {
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
            }

            noise.start();
        }

        // Configuration and State
        const videoElement = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('gameContainer');

        let isPlaying = false;
        let score = 0;
        let lives = 3;
        let selectedDiff = 'medium';

        let fruits = [];
        let particles = [];
        let trail = [];

        // Hand tracking positions
        let pointer = { x: 0, y: 0, active: false };
        let prevPointer = { x: 0, y: 0 };
        const HAND_SMOOTHING = 0.45;

        // Settings based on difficulty
        const DIFF_SETTINGS = {
            easy: { spawnRate: 0.015, speedMult: 0.8, bombProb: 0.15 },
            medium: { spawnRate: 0.025, speedMult: 1.0, bombProb: 0.25 },
            hard: { spawnRate: 0.04, speedMult: 1.25, bombProb: 0.35 }
        };

        const FRUIT_TYPES = [
            { name: 'watermelon', color: '#4caf50', innerColor: '#ff5252', radius: 45, points: 10 },
            { name: 'orange', color: '#ff9800', innerColor: '#ffe0b2', radius: 35, points: 10 },
            { name: 'apple', color: '#f44336', innerColor: '#fff9c4', radius: 32, points: 10 },
            { name: 'lemon', color: '#ffee58', innerColor: '#fffde7', radius: 28, points: 15 },
            { name: 'bomb', color: '#212121', innerColor: '#ff5252', radius: 30, isBomb: true }
        ];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function selectDifficulty(diff) {
            selectedDiff = diff;
            document.querySelectorAll('.diff-card').forEach(card => card.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
        }

        // MediaPipe Setup
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onHandResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        camera.start().catch(err => {
            console.error(err);
            document.getElementById('warning').style.display = 'block';
        });

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indexTip = landmarks[8];

                // Mirror horizontally to match webcam layout
                const targetX = (1 - indexTip.x) * canvas.width;
                const targetY = indexTip.y * canvas.height;

                if (!pointer.active) {
                    pointer.x = targetX;
                    pointer.y = targetY;
                    pointer.active = true;
                } else {
                    pointer.x += (targetX - pointer.x) * HAND_SMOOTHING;
                    pointer.y += (targetY - pointer.y) * HAND_SMOOTHING;
                }
            } else {
                pointer.active = false;
            }
        }

        // Mouse Fallback for non-camera testing
        window.addEventListener('mousemove', (e) => {
            if (!pointer.active) {
                pointer.x = e.clientX;
                pointer.y = e.clientY;
            }
        });

        function startGame() {
            score = 0;
            lives = 3;
            fruits = [];
            particles = [];
            trail = [];
            isPlaying = true;

            document.getElementById('score').innerText = score;
            updateLives();

            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.add('hidden');
            document.getElementById('hud').classList.remove('faded');

            requestAnimationFrame(gameLoop);
        }

        function restartGame() {
            startGame();
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('finalScoreText').innerText = `Your Final Score: ${score}`;
            document.getElementById('gameOverOverlay').classList.remove('hidden');
            document.getElementById('hud').classList.add('faded');
        }

        function updateLives() {
            const hearts = document.querySelectorAll('.heart');
            hearts.forEach((heart, index) => {
                if (index < lives) {
                    heart.classList.remove('lost');
                } else {
                    heart.classList.add('lost');
                }
            });
        }

        // Spawning Mechanics
        function spawnFruit() {
            const config = DIFF_SETTINGS[selectedDiff];
            const isBomb = Math.random() < config.bombProb;
            
            let type;
            if (isBomb) {
                type = FRUIT_TYPES.find(t => t.isBomb);
            } else {
                const normalFruits = FRUIT_TYPES.filter(t => !t.isBomb);
                type = normalFruits[Math.floor(Math.random() * normalFruits.length)];
            }

            const margin = 100;
            const x = margin + Math.random() * (canvas.width - margin * 2);
            const y = canvas.height + type.radius;

            const targetX = canvas.width / 2 + (Math.random() - 0.5) * 300;
            const vx = (targetX - x) * 0.012;
            const vy = -(14 + Math.random() * 4) * config.speedMult;

            fruits.push({
                ...type,
                x, y,
                vx, vy,
                gravity: 0.38,
                rotation: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 0.1,
                sliced: false,
                halves: []
            });
        }

        // Raycast Collision Detection (Segment-to-Circle)
        function lineIntersectsCircle(p1, p2, circle) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const len = Math.hypot(dx, dy);

            if (len === 0) return Math.hypot(p1.x - circle.x, p1.y - circle.y) <= circle.radius;

            const u = ((circle.x - p1.x) * dx + (circle.y - p1.y) * dy) / (len * len);
            const clampedU = Math.max(0, Math.min(1, u));

            const nearestX = p1.x + clampedU * dx;
            const nearestY = p1.y + clampedU * dy;

            return Math.hypot(nearestX - circle.x, nearestY - circle.y) <= circle.radius;
        }

        function createSplatter(x, y, color) {
            for (let i = 0; i < 25; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 8;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: 3 + Math.random() * 6,
                    color: color,
                    alpha: 1,
                    decay: 0.015 + Math.random() * 0.02
                });
            }
        }

        function sliceFruit(fruit, index) {
            if (fruit.isBomb) {
                showKaboom();
                return;
            }

            playSplatSound();
            fruit.sliced = true;
            score += fruit.points;
            document.getElementById('score').innerText = score;

            createSplatter(fruit.x, fruit.y, fruit.color);

            // Compute slice angle for accurate dynamic half movement
            const sliceAngle = Math.atan2(pointer.y - prevPointer.y, pointer.x - prevPointer.x);
            const perpAngle = sliceAngle + Math.PI / 2;

            const popSpeed = 4;
            fruit.halves = [
                {
                    x: fruit.x, y: fruit.y,
                    vx: fruit.vx + Math.cos(perpAngle) * popSpeed,
                    vy: fruit.vy + Math.sin(perpAngle) * popSpeed,
                    rotation: fruit.rotation,
                    vRot: -0.15,
                    side: -1
                },
                {
                    x: fruit.x, y: fruit.y,
                    vx: fruit.vx - Math.cos(perpAngle) * popSpeed,
                    vy: fruit.vy - Math.sin(perpAngle) * popSpeed,
                    rotation: fruit.rotation,
                    vRot: 0.15,
                    side: 1
                }
            ];
        }

        function showKaboom(ending = true) {
            playKaboomSound(pointer.x);
            container.classList.add('shake');
            setTimeout(() => container.classList.remove('shake'), 400);

            const flash = document.getElementById('kaboomFlash');
            flash.style.opacity = '0.9';
            setTimeout(() => flash.style.opacity = '0', 250);

            if (ending) {
                lives = 0;
                updateLives();
                gameOver();
            }
        }

        // Main Loop
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!isPlaying) return;

            // Trail Updates
            if (pointer.active) {
                trail.push({ x: pointer.x, y: pointer.y, time: Date.now() });
                if (trail.length > 1 && Math.hypot(pointer.x - prevPointer.x, pointer.y - prevPointer.y) > 15) {
                    playSwooshSound();
                }
            }
            const now = Date.now();
            trail = trail.filter(p => now - p.time < 150);

            // Draw Trail
            if (trail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(trail[0].x, trail[0].y);
                for (let i = 1; i < trail.length; i++) {
                    ctx.lineTo(trail[i].x, trail[i].y);
                }
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = 15;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Spawn Chance
            if (Math.random() < DIFF_SETTINGS[selectedDiff].spawnRate) {
                spawnFruit();
            }

            // Update & Render Fruits
            for (let i = fruits.length - 1; i >= 0; i--) {
                const f = fruits[i];

                if (!f.sliced) {
                    f.x += f.vx;
                    f.vy += f.gravity;
                    f.y += f.vy;
                    f.rotation += f.vRot;

                    // Slice Check using raycast segment-to-circle intersection
                    if (trail.length > 1) {
                        const p1 = trail[trail.length - 2];
                        const p2 = trail[trail.length - 1];
                        if (lineIntersectsCircle(p1, p2, f)) {
                            sliceFruit(f, i);
                        }
                    }

                    // Render Whole Fruit
                    ctx.save();
                    ctx.translate(f.x, f.y);
                    ctx.rotate(f.rotation);

                    if (f.isBomb) {
                        ctx.beginPath();
                        ctx.arc(0, 0, f.radius, 0, Math.PI * 2);
                        ctx.fillStyle = f.color;
                        ctx.fill();
                        ctx.lineWidth = 3;
                        ctx.strokeStyle = '#444';
                        ctx.stroke();

                        // Bomb Fuse Spark
                        ctx.beginPath();
                        ctx.arc(f.radius * 0.7, -f.radius * 0.7, 4, 0, Math.PI * 2);
                        ctx.fillStyle = '#ff5252';
                        ctx.shadowColor = '#ff5252';
                        ctx.shadowBlur = 10;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    } else {
                        ctx.beginPath();
                        ctx.arc(0, 0, f.radius, 0, Math.PI * 2);
                        ctx.fillStyle = f.color;
                        ctx.fill();

                        ctx.beginPath();
                        ctx.arc(0, 0, f.radius * 0.8, 0, Math.PI * 2);
                        ctx.fillStyle = f.innerColor;
                        ctx.fill();
                    }
                    ctx.restore();

                    // Missed Fruit Check
                    if (f.y > canvas.height + 100) {
                        if (!f.isBomb) {
                            lives--;
                            updateLives();
                            if (lives <= 0) gameOver();
                        }
                        fruits.splice(i, 1);
                    }

                } else {
                    // Render Halves
                    let allOffscreen = true;
                    f.halves.forEach(h => {
                        h.x += h.vx;
                        h.vy += f.gravity;
                        h.y += h.vy;
                        h.rotation += h.vRot;

                        if (h.y < canvas.height + 100) allOffscreen = false;

                        ctx.save();
                        ctx.translate(h.x, h.y);
                        ctx.rotate(h.rotation);

                        ctx.beginPath();
                        ctx.arc(0, 0, f.radius, 0, Math.PI);
                        ctx.fillStyle = f.color;
                        ctx.fill();

                        ctx.beginPath();
                        ctx.arc(0, 0, f.radius * 0.8, 0, Math.PI);
                        ctx.fillStyle = f.innerColor;
                        ctx.fill();

                        ctx.restore();
                    });

                    if (allOffscreen) fruits.splice(i, 1);
                }
            }

            // Update & Render Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Render Hand Pointer Landmark Target
            if (pointer.active) {
                ctx.beginPath();
                ctx.arc(pointer.x, pointer.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#00e5ff';
                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            prevPointer = { ...pointer };
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
